<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lost & Found Image Matcher</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
    }
    h2 {
      text-align: center;
      color: #333;
    }
    form {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      max-width: 400px;
      margin: 0 auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    input[type="file"] {
      width: 100%;
      margin: 10px 0;
    }
    button {
      background-color: #007BFF;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .messages {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
    }
    .alert {
      background-color: #e7f3fe;
      color: #31708f;
      padding: 10px;
      border: 1px solid #bce8f1;
      border-radius: 5px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h2>🔍 Match Lost Item with Found Items</h2>

  <form action="{{ url_for('customer_app.match_items') }}" method="post" enctype="multipart/form-data">

    <label for="photo"><strong>Select Lost Item Image:</strong></label><br>
    <input type="file" id="photo" name="photo" accept="image/*" required><br><br>
    <button type="submit">Match Item</button>
  </form>

  <div class="messages">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for msg in messages %}
          <div class="alert">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
